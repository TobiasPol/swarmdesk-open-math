name: selftest

on:
  workflow_call:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Mathlib and Lean build (main only)
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
            ~/.elan/toolchains
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}

      - name: Fetch cache and run selftest
        run: |
          lake exe cache get
          scripts/selftest.sh

      - name: Upload lake-manifest.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lake-manifest
          path: lake-manifest.json
          if-no-files-found: ignore
          retention-days: 7
